version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: incidentpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: incidentpilot
      POSTGRES_USER: incidentpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_postgres_secret_pass_12345}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentpilot -d incidentpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incidentpilot-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://incidentpilot:${POSTGRES_PASSWORD:-dev_postgres_secret_pass_12345}@postgres:5432/incidentpilot
      JWT_SECRET: ${JWT_SECRET:-production_jwt_secret_min_32_characters_long_12345}
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:8000"]'
      AGORA_APP_ID: ${AGORA_APP_ID:-}
      AGORA_APP_CERTIFICATE: ${AGORA_APP_CERTIFICATE:-}
      WORKERS: 4
      PORT: 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
